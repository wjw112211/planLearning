cmd_vel_watchdog:
  cmd_vel_topic: /cmd_vel
  timeout: 0.5
  publish_rate: 20.0


slam_gmapping:
  base_frame: base_footprint
  odom_frame: odom
  map_frame: map
  map_update_interval: 1.0
  maxUrange: 4.0
  minimumScore: 50
  linearUpdate: 0.15
  angularUpdate: 0.15
  temporalUpdate: 0.5
  delta: 0.05
  particles: 80
  xmin: -20.0
  ymin: -20.0
  xmax: 20.0
  ymax: 20.0

occupancy_grid_to_cost_map:
  input_topic: /map
  grid_map_topic: /grid_map
  costmap_topic: /costmap
  occupancy_layer: occupancy
  cost_layer: cost
  lethal_threshold: 65.0
  inscribed_radius: 0.20
  inflation_radius: 0.50
  cost_scaling_factor: 5.0

# ---------------------------------------------------------------------------
# 静态地图（文件版）
# gazebo_grid_map.launch 里 static_map_source=file（默认值）时用它：
# grid_map_manual_mapping 的 manual_mapping_node 以"定位模式"跑起来，加载 pgm + 同名 yaml，
# 发 /map，并发布 map->odom。maps_dir 由 launch 的 maps_dir 参数注入。
#
# ★ 想换地图，只改下面的 map_file ★（名字 / 带 .pgm .yaml 后缀 / 绝对路径都行）：
#     map_file: latest                   # maps 目录里最新的一张（每次"保存地图"都会更新）
#     map_file: map_20260927_190513      # 指定某一张
#     map_file: /home/wjw/maps/xxx.pgm   # 绝对路径也行
# ---------------------------------------------------------------------------
static_map_loader:
  default_mode: localization     # 固定"定位模式"：只加载地图，不建图
  map_file: latest               # ★ 换地图就改这里
  fallback_to_latest: true       # map_file 找不到时退回"最新的一张"；false = 不退回，直接报错
  publish_map_to_odom: true      # 发布 map->odom（当静态地图用时必须有）
  mode_topic: /static_map/mode   # 用不到；换个名字免得和手动建图的 /manual_mapping/mode 串
  status_topic: /static_map/status
  map_topic: /map
  map_frame: map
  odom_frame: odom
  publish_rate: 1.0
  # 下面这些只在 pgm 旁边缺同名 .yaml 时当兜底；正常情况以 yaml 里的元信息为准
  resolution: 0.05
  width: 200
  height: 200
  origin_x: -5.0
  origin_y: -5.0
  occupied_thresh: 0.65
  free_thresh: 0.196
  negate: 0
