# Parameters for Algorithm/src/bringup/launch/gazebo_grid_map.launch.
# Keep launch-graph switches such as use_static_map/run_slam as roslaunch args;
# node runtime parameters are centralized here.

cmd_vel_watchdog:
  cmd_vel_topic: /cmd_vel
  timeout: 0.5
  publish_rate: 20.0

slam_gmapping:
  base_frame: base_footprint
  odom_frame: odom
  map_frame: map
  map_update_interval: 1.0
  maxUrange: 4.0
  minimumScore: 50
  linearUpdate: 0.15
  angularUpdate: 0.15
  temporalUpdate: 0.5
  delta: 0.05
  particles: 80
  xmin: -20.0
  ymin: -20.0
  xmax: 20.0
  ymax: 20.0

static_turtlebot3_world_map:
  frame_id: map
  map_type: turtlebot3_world
  resolution: 0.05
  width: 200
  height: 200
  origin_x: -5.0
  origin_y: -5.0
  publish_rate: 1.0

occupancy_grid_to_cost_map:
  input_topic: /map
  grid_map_topic: /grid_map
  costmap_topic: /costmap
  occupancy_layer: occupancy
  cost_layer: cost
  lethal_threshold: 65.0
  inscribed_radius: 0.20
  inflation_radius: 0.50
  cost_scaling_factor: 10.0
