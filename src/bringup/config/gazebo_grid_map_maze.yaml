# 迷宫世界（worlds/turtlebot3_maze.world）专用的运行参数，其它参数与
# config/gazebo_grid_map.yaml 完全一致，只是把静态地图换成了"由 data 描述"的版本。
#
# 用法（原来的 gazebo_grid_map.yaml 一个字都不用改）：
#   roslaunch bringup gazebo_grid_map.launch \
#     config_file:=$(rospack find bringup)/config/gazebo_grid_map_maze.yaml
#
# 注意：map_type: walls 需要 static_turtlebot3_world_map.cpp 支持这个类型，
#       补丁见 docs/gazebo_maze_world.md 第 9 节；没打补丁之前请改用
#       use_static_map:=false run_slam:=true（让 gmapping 现场建图）。

cmd_vel_watchdog:
  cmd_vel_topic: /cmd_vel
  timeout: 0.5
  publish_rate: 20.0


slam_gmapping:
  base_frame: base_footprint
  odom_frame: odom
  map_frame: map
  map_update_interval: 1.0
  maxUrange: 4.0
  minimumScore: 50
  linearUpdate: 0.15
  angularUpdate: 0.15
  temporalUpdate: 0.5
  delta: 0.05
  particles: 80
  xmin: -20.0
  ymin: -20.0
  xmax: 20.0
  ymax: 20.0


static_turtlebot3_world_map:
  frame_id: map
  map_type: walls            # 逐条画下面的 walls；原来是 turtlebot3_world / turtlebot3_square
  resolution: 0.05
  width: 200
  height: 200
  origin_x: -5.0
  origin_y: -5.0
  publish_rate: 1.0
  # 每条墙 = [中心x, 中心y, x向长度, y向长度, yaw(逆时针, rad)]
  # 与 worlds/turtlebot3_maze.world 里的 23 个墙块一一对应，
  # 可用 tools 里的 world_to_walls.py 从 world 文件重新生成（永不跑偏）。
  walls:
    - [0.000, -3.000, 6.150, 0.150, 0.0000]
    - [-1.500, -2.000, 1.150, 0.150, 0.0000]
    - [1.000, -2.000, 2.150, 0.150, 0.0000]
    - [-0.500, -1.000, 1.150, 0.150, 0.0000]
    - [2.000, -1.000, 2.150, 0.150, 0.0000]
    - [-2.000, 0.000, 2.150, 0.150, 0.0000]
    - [0.500, 0.000, 1.150, 0.150, 0.0000]
    - [-1.500, 1.000, 1.150, 0.150, 0.0000]
    - [1.000, 1.000, 2.150, 0.150, 0.0000]
    - [-0.500, 2.000, 1.150, 0.150, 0.0000]
    - [1.500, 2.000, 1.150, 0.150, 0.0000]
    - [0.000, 3.000, 6.150, 0.150, 0.0000]
    - [-3.000, 0.000, 0.150, 6.150, 0.0000]
    - [-2.000, -2.000, 0.150, 2.150, 0.0000]
    - [-2.000, 1.500, 0.150, 1.150, 0.0000]
    - [-1.000, -0.500, 0.150, 1.150, 0.0000]
    - [-1.000, 1.500, 0.150, 1.150, 0.0000]
    - [0.000, -1.000, 0.150, 2.150, 0.0000]
    - [0.000, 2.500, 0.150, 1.150, 0.0000]
    - [1.000, 0.500, 0.150, 1.150, 0.0000]
    - [2.000, -0.500, 0.150, 1.150, 0.0000]
    - [2.000, 1.500, 0.150, 1.150, 0.0000]
    - [3.000, 0.000, 0.150, 6.150, 0.0000]

occupancy_grid_to_cost_map:
  input_topic: /map
  grid_map_topic: /grid_map
  costmap_topic: /costmap
  occupancy_layer: occupancy
  cost_layer: cost
  lethal_threshold: 65.0
  inscribed_radius: 0.20
  inflation_radius: 0.50
  cost_scaling_factor: 10.0
